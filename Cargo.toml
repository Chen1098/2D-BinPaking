[package]
name = "kestrel"
version = "1.0.0"
edition = "2021"
description = "2D irregular nesting / bin packing solver: exact no-fit-polygon distance fields + guided local search"
license = "MIT"
repository = "https://github.com/Chen1098/2D-BinPaking"
default-run = "kestrel"

[dependencies]
serde_json = "1"
rayon = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
